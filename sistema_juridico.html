// ─── SUPABASE ─────────────────────────────────────────────────────────────────
const sbClient = (window.SUPABASE_URL && window.SUPABASE_KEY && window.supabase)
  ? window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_KEY)
  : null;

async function sb_carregar() {
  const { data, error } = await sbClient
    .from('jud_processos')
    .select('*, jud_audiencias(*), jud_notas(*), jud_arquivos(*), jud_partes(*)')
    .order('created_at', { ascending: false });
  if (error) throw error;
  return data.map(p => ({
    id: p.id,
    numero: p.numero,
    tipo: p.tipo,
    fase: p.fase,
    parte: p.parte || '',
    tribunal: p.tribunal || '',
    tramitacao: p.tramitacao || '',
    partes: (p.jud_partes || []).map(pt => ({ id:pt.id, nome:pt.nome, documento:pt.documento||'', polo:pt.polo, tipo_pessoa:pt.tipo_pessoa||'' })),
    audiencias: (p.jud_audiencias || [])
      .sort((a,b) => a.data.localeCompare(b.data))
      .map(a => ({ id:a.id, data:a.data, hora:a.hora?.slice(0,5)||'', tipo:a.tipo||'', local:a.local||'', obs:a.obs||'' })),
    notas: (p.jud_notas || [])
      .sort((a,b) => a.created_at.localeCompare(b.created_at))
      .map(n => ({ id:n.id, texto:n.texto, autor:n.autor, createdAt:n.created_at })),
    arquivos: (p.jud_arquivos || [])
      .map(f => ({ id:f.id, nome:f.nome, tipo:f.tipo||'', tamanho:f.tamanho||0, tamanhoComprimido:f.tamanho_comprimido||0, base64:f.base64, url:f.url_externa, addedAt:f.created_at })),
    createdAt: p.created_at,
    updatedAt: p.updated_at,
  }));
}

async function sb_salvar(proc) {
  // Verifica sessão ativa
  const { data: { session } } = await sbClient.auth.getSession();
  if (!session) throw new Error('Sessão expirada — faça login novamente');

  const { data, error: pe } = await sbClient.from('jud_processos').upsert({
    id: proc.id,
    numero: proc.numero, tipo: proc.tipo, fase: proc.fase,
    parte: proc.parte || '', tribunal: proc.tribunal || '', tramitacao: proc.tramitacao || '',
    updated_at: new Date().toISOString(),
  }, { onConflict: 'id' }).select();
  if (pe) throw pe;
  if (!data?.length) throw new Error('Nenhum dado retornado pelo Supabase após salvar');
  const pid = data[0].id;

  await sbClient.from('jud_audiencias').delete().eq('processo_id', pid);
  if (proc.audiencias?.length) {
    const { error } = await sbClient.from('jud_audiencias').insert(
      proc.audiencias.map(a => ({ id:a.id, processo_id:pid, data:a.data, hora:a.hora||null, tipo:a.tipo, local:a.local||'', obs:a.obs||'' }))
    );
    if (error) throw error;
  }

  await sbClient.from('jud_notas').delete().eq('processo_id', pid);
  if (proc.notas?.length) {
    const { error } = await sbClient.from('jud_notas').insert(
      proc.notas.map(n => ({ id:n.id, processo_id:pid, texto:n.texto, autor:n.autor||'Usuário', created_at:n.createdAt }))
    );
    if (error) throw error;
  }

  await sbClient.from('jud_arquivos').delete().eq('processo_id', pid);
  if (proc.arquivos?.length) {
    const { error } = await sbClient.from('jud_arquivos').insert(
      proc.arquivos.map(f => ({ id:f.id, processo_id:pid, nome:f.nome, tipo:f.tipo||'', tamanho:f.tamanho||0, tamanho_comprimido:f.tamanhoComprimido||0, base64:f.base64||null, url_externa:f.url||null }))
    );
    if (error) throw error;
  }

  await sbClient.from('jud_partes').delete().eq('processo_id', pid);
  if (proc.partes?.length) {
    const { error } = await sbClient.from('jud_partes').insert(
      proc.partes.map(pt => ({ id:pt.id, processo_id:pid, nome:pt.nome, documento:pt.documento||null, polo:pt.polo, tipo_pessoa:pt.tipo_pessoa||null }))
    );
    if (error) throw error;
  }

  return { ...proc, id: pid };
}

async function sb_deletar(id) {
  const { error } = await sbClient.from('jud_processos').delete().eq('id', id);
  if (error) throw error;
}

async function sb_migrar(processos) {
  for (const proc of processos) {
    await sb_salvar(proc);
  }
}

// ─── STORAGE ─────────────────────────────────────────────────────────────────
const STORAGE_KEY = 'sj_db_machado_v2';
const uid = () => crypto.randomUUID
  ? crypto.randomUUID()
  : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
      const r = Math.random() * 16 | 0;
      return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
    });
const now = () => new Date().toISOString();

function loadData() {
  try {
    const s = localStorage.getItem(STORAGE_KEY);
    if (s) return JSON.parse(s);
  } catch {}
  return {
    processos: PROCESSOS_INICIAIS.map((p, i) => ({
      id: `p${i+1}`, ...p,
      audiencias: [], arquivos: [],
      notas: p.obs ? [{ id: uid(), texto: p.obs, autor: 'Importado', createdAt: now() }] : [],
      createdAt: now(), updatedAt: now()
    })),
    config: { claudeKey: window.CLAUDE_KEY || '' }
  };
}

function saveData(data) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch(e) {
    alert('Erro ao salvar: ' + e.message);
  }
}

// ─── LOGIN ───────────────────────────────────────────────────────────────────
function Login() {
  const [email, setEmail] = useState('');
  const [senha, setSenha] = useState('');
  const [erro, setErro] = useState('');
  const [loading, setLoading] = useState(false);

  const entrar = async (e) => {
    e.preventDefault();
    if (!email || !senha) return;
    setLoading(true);
    setErro('');
    const { error } = await sbClient.auth.signInWithPassword({ email, password: senha });
    if (error) {
      setErro('E-mail ou senha incorretos.');
      setLoading(false);
    }
    // Se ok, onAuthStateChange no App cuida do resto
  };

  return (
    <div style={{ flex:1, width:'100%', background:'var(--bg)', display:'flex', alignItems:'center', justifyContent:'center', padding:24 }}>
      <div style={{ width:'100%', maxWidth:400 }}>
        <div style={{ textAlign:'center', marginBottom:32 }}>
          <div style={{ fontSize:48, marginBottom:12 }}>⚖️</div>
          <div style={{ fontSize:22, fontWeight:800, color:'var(--text)' }}>DB Machado</div>
          <div style={{ fontSize:13, color:'var(--muted)', marginTop:4 }}>Sistema Jurídico Interno</div>
        </div>

        <form onSubmit={entrar} style={{ background:'var(--surface)', border:'1px solid var(--border)', borderRadius:14, padding:28, display:'flex', flexDirection:'column', gap:16 }}>
          <div className="field">
            <label>E-mail</label>
            <input type="email" value={email} onChange={e=>setEmail(e.target.value)}
              placeholder="seu@email.com" autoFocus autoComplete="email" />
          </div>
          <div className="field">
            <label>Senha</label>
            <input type="password" value={senha} onChange={e=>setSenha(e.target.value)}
              placeholder="••••••••" autoComplete="current-password" />
          </div>

          {erro && (
            <div style={{ background:'rgba(239,68,68,.1)', border:'1px solid rgba(239,68,68,.3)', borderRadius:8, padding:'10px 14px', color:'var(--red)', fontSize:13 }}>
              {erro}
            </div>
          )}

          <button type="submit" className="btn-primary" disabled={loading || !email || !senha}
            style={{ padding:'12px', fontSize:15, marginTop:4 }}>
            {loading ? 'Entrando...' : 'Entrar'}
          </button>
        </form>

        <div style={{ textAlign:'center', marginTop:16, fontSize:11, color:'var(--muted)' }}>
          Acesso restrito. Para criar conta fale com o administrador.
        </div>
      </div>
    </div>
  );
}

  { id:'adm',       icon:'🏛️', label:'Administrativo' },
  { id:'agenda',    icon:'📅', label:'Agenda' },
  { id:'ia',        icon:'🤖', label:'IA Jurídica' },
  { id:'config',    icon:'⚙️', label:'Configurações' },
];

function Sidebar({ view, setView, counts, user, onLogout }) {
  const email = user?.email || '';
  const nome = email.split('@')[0];

  return (
    <div style={{ width:200, background:'#131f35', borderRight:'1px solid var(--border)', display:'flex', flexDirection:'column', flexShrink:0, height:'100vh' }}>

        <div style={{ fontWeight:800, fontSize:15, color:'var(--text)' }}>⚖️ DB Machado</div>
        <div style={{ fontSize:11, color:'var(--muted)', marginTop:2 }}>Sistema Jurídico</div>
      </div>
      <nav style={{ flex:1, padding:'8px 8px', display:'flex', flexDirection:'column', gap:2 }}>
        {NAV.map(n => {
          const active = view === n.id;
          const count = counts[n.id];
          return (
            <button key={n.id} onClick={() => setView(n.id)}
              style={{ display:'flex', alignItems:'center', gap:10, padding:'9px 12px', borderRadius:8, border:'none', cursor:'pointer', textAlign:'left', width:'100%', background: active ? 'rgba(59,130,246,.2)' : 'transparent', color: active ? '#93c5fd' : 'var(--muted)', fontWeight: active ? 700 : 400, fontSize:13, transition:'all .15s' }}>
              <span style={{ fontSize:15 }}>{n.icon}</span>
              <span style={{ flex:1 }}>{n.label}</span>
              {count > 0 && <span style={{ fontSize:10, background: active ? 'var(--blue)' : 'var(--surface2)', color:'#fff', borderRadius:99, padding:'1px 6px', fontWeight:700 }}>{count}</span>}
            </button>
          );
        })}
      </nav>
      <div style={{ padding:'12px 16px', borderTop:'1px solid var(--border)' }}>
        <div style={{ fontSize:12, color:'var(--text)', fontWeight:600, marginBottom:2, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{nome}</div>
        <div style={{ fontSize:10, color:'var(--muted)', marginBottom:10, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{email}</div>
        <button onClick={onLogout} style={{ width:'100%', background:'rgba(239,68,68,.1)', border:'1px solid rgba(239,68,68,.2)', color:'var(--red)', borderRadius:6, padding:'6px 0', fontSize:12, cursor:'pointer', fontWeight:600 }}>
          Sair
        </button>
      </div>
    </div>
  );
}

// ─── DASHBOARD ────────────────────────────────────────────────────────────────
function Dashboard({ processos, setView, setProcessoAberto }) {
  const hoje = new Date().toISOString().slice(0,10);
  const em7dias = new Date(Date.now() + 7*86400000).toISOString().slice(0,10);

  const ativos = processos.filter(p => p.fase !== 'Arquivado');
  const execucao = processos.filter(p => p.fase === 'Execução');
  const juridicos = processos.filter(p => p.tipo === 'juridico' && p.fase !== 'Arquivado');
  const adms = processos.filter(p => p.tipo === 'administrativo' && p.fase !== 'Arquivado');

  const audienciasProximas = processos.flatMap(p =>
    (p.audiencias||[]).filter(a => a.data >= hoje && a.data <= em7dias).map(a => ({ ...a, processo: p }))
  ).sort((a,b) => a.data.localeCompare(b.data));

  const audienciasHoje = processos.flatMap(p =>
    (p.audiencias||[]).filter(a => a.data === hoje).map(a => ({ ...a, processo: p }))
  );

  function StatCard({ icon, label, value, color, onClick }) {
    return (
      <div onClick={onClick} style={{ background:'var(--surface)', border:'1px solid var(--border)', borderRadius:12, padding:'16px 20px', cursor: onClick ? 'pointer' : 'default', transition:'border-color .2s', display:'flex', alignItems:'center', gap:14 }}
        onMouseEnter={e => onClick && (e.currentTarget.style.borderColor = color || 'var(--blue)')}
        onMouseLeave={e => (e.currentTarget.style.borderColor = 'var(--border)')}>
        <div style={{ fontSize:28 }}>{icon}</div>
        <div>
          <div style={{ fontSize:26, fontWeight:800, color: color || 'var(--text)' }}>{value}</div>
          <div style={{ fontSize:12, color:'var(--muted)' }}>{label}</div>
        </div>
      </div>
    );
  }

  return (
    <div style={{ flex:1, overflow:'auto', padding:28 }}>
      <div style={{ fontSize:20, fontWeight:800, marginBottom:20 }}>
        Olá 👋 &nbsp;<span style={{ fontSize:14, color:'var(--muted)', fontWeight:400 }}>{new Date().toLocaleDateString('pt-BR', { weekday:'long', day:'numeric', month:'long' })}</span>
      </div>

      {audienciasHoje.length > 0 && (
        <div style={{ background:'rgba(239,68,68,.08)', border:'1px solid rgba(239,68,68,.3)', borderRadius:12, padding:'14px 18px', marginBottom:20, display:'flex', alignItems:'center', gap:12 }}>
          <span style={{ fontSize:24 }}>🔔</span>
          <div>
            <div style={{ fontWeight:700, color:'#f87171', fontSize:14 }}>Audiência hoje!</div>
            {audienciasHoje.map(a => (
              <div key={a.id} style={{ fontSize:13, color:'var(--text)', marginTop:2 }}>
                {a.hora && `${a.hora} — `}{a.tipo} · <span style={{ color:'var(--muted)' }}>{a.processo.parte}</span>
              </div>
            ))}
          </div>
        </div>
      )}

      <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fill, minmax(180px,1fr))', gap:12, marginBottom:24 }}>
        <StatCard icon="📁" label="Processos ativos" value={ativos.length} />
        <StatCard icon="🔴" label="Em execução" value={execucao.length} color="var(--red)" onClick={() => setView('juridico')} />
        <StatCard icon="⚖️" label="Jurídicos ativos" value={juridicos.length} color="#a78bfa" onClick={() => setView('juridico')} />
        <StatCard icon="🏛️" label="Administrativos" value={adms.length} color="var(--orange)" onClick={() => setView('adm')} />
        <StatCard icon="📅" label="Audiências (7 dias)" value={audienciasProximas.length} color="var(--green)" onClick={() => setView('agenda')} />
      </div>

      <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:16 }}>
        <div style={{ background:'var(--surface)', border:'1px solid var(--border)', borderRadius:12, padding:20 }}>
          <div style={{ fontWeight:700, fontSize:14, marginBottom:14, display:'flex', alignItems:'center', gap:8 }}>
            📅 Próximas audiências <span style={{ fontSize:11, color:'var(--muted)', fontWeight:400 }}>— 7 dias</span>
          </div>
          {audienciasProximas.length === 0
            ? <div style={{ color:'var(--muted)', fontSize:13 }}>Nenhuma audiência nos próximos 7 dias.</div>
            : audienciasProximas.map(a => (
              <div key={a.id} onClick={() => { setProcessoAberto(a.processo); setView('detalhe'); }}
                style={{ padding:'10px 0', borderBottom:'1px solid var(--border)', cursor:'pointer', display:'flex', gap:12, alignItems:'flex-start' }}>
                <div style={{ textAlign:'center', minWidth:40 }}>
                  <div style={{ fontSize:18, fontWeight:800, color:'var(--blue)', lineHeight:1 }}>{a.data.slice(8)}</div>
                  <div style={{ fontSize:10, color:'var(--muted)' }}>{['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'][parseInt(a.data.slice(5,7))-1]}</div>
                </div>
                <div>
                  <div style={{ fontSize:13, fontWeight:600 }}>{a.tipo} {a.hora && <span style={{ color:'var(--blue)', fontWeight:400 }}>· {a.hora}</span>}</div>
                  <div style={{ fontSize:12, color:'var(--muted)' }}>{a.processo.parte}</div>
                  <div style={{ fontSize:11, color:'var(--muted)' }}>{a.processo.tribunal} · {a.processo.tramitacao}</div>
                </div>
              </div>
            ))
          }
        </div>

        <div style={{ background:'var(--surface)', border:'1px solid var(--border)', borderRadius:12, padding:20 }}>
          <div style={{ fontWeight:700, fontSize:14, marginBottom:14 }}>🔴 Execuções em andamento</div>
          {execucao.length === 0
            ? <div style={{ color:'var(--muted)', fontSize:13 }}>Nenhuma execução ativa.</div>
            : execucao.slice(0,8).map(p => (
              <div key={p.id} onClick={() => { setProcessoAberto(p); setView('detalhe'); }}
                style={{ padding:'8px 0', borderBottom:'1px solid var(--border)', cursor:'pointer' }}>
                <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', gap:8 }}>
                  <div style={{ fontSize:12, fontFamily:'monospace', color:'#93c5fd', flex:1, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{p.numero}</div>
                  <Badge label={p.tribunal} color="#94a3b8" bg="rgba(148,163,184,.1)" size={10} />
                </div>
                <div style={{ fontSize:12, color:'var(--muted)', marginTop:2, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{p.parte}</div>
              </div>
            ))
          }
        </div>
      </div>
    </div>
  );
}

// ─── LISTA DE PROCESSOS ───────────────────────────────────────────────────────
function ProcessoList({ processos, tipo, setProcessoAberto, setView, onAdd, onImportDJE }) {
  const [busca, setBusca] = useState('');
  const [filtroFase, setFiltroFase] = useState('Todos');
  const [filtroTribunal, setFiltroTribunal] = useState('Todos');
  const [filtroRamo, setFiltroRamo] = useState('Todos'); // só para tipo juridico

  const isTRT = (trib) => (trib||'').toUpperCase().startsWith('TRT');

  const lista = processos.filter(p => {
    if (p.tipo !== tipo) return false;
    if (tipo === 'juridico') {
      if (filtroRamo === 'Cível' && isTRT(p.tribunal)) return false;
      if (filtroRamo === 'Trabalhista' && !isTRT(p.tribunal)) return false;
    }
    if (filtroFase !== 'Todos' && p.fase !== filtroFase) return false;
    if (filtroTribunal !== 'Todos' && p.tribunal !== filtroTribunal) return false;
    if (busca) {
      const q = busca.toLowerCase();
      return p.numero.toLowerCase().includes(q) || p.parte.toLowerCase().includes(q) || (p.tribunal||'').toLowerCase().includes(q);
    }
    return true;
  });

  const tribunais = ['Todos', ...new Set(
    processos.filter(p => {
      if (p.tipo !== tipo) return false;
      if (tipo === 'juridico') {
        if (filtroRamo === 'Cível' && isTRT(p.tribunal)) return false;
        if (filtroRamo === 'Trabalhista' && !isTRT(p.tribunal)) return false;
      }
      return true;
    }).map(p => p.tribunal)
  )];

  const st = TIPO_STYLE[tipo];

  return (
    <div style={{ flex:1, overflow:'auto', padding:28 }}>
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:20 }}>
        <div>
          <div style={{ fontSize:20, fontWeight:800 }}>{st.icon} {st.label}</div>
          <div style={{ fontSize:13, color:'var(--muted)', marginTop:2 }}>{lista.length} processo(s)</div>
        </div>
        <div style={{ display:'flex', gap:8 }}>
          <button className="btn-secondary" onClick={onImportDJE} style={{ display:'flex', alignItems:'center', gap:6 }}>
            📄 Importar Notificação
          </button>
          <button className="btn-primary" onClick={onAdd} style={{ display:'flex', alignItems:'center', gap:6 }}>
            + Novo processo
          </button>
        </div>
      </div>

      {tipo === 'juridico' && (
        <div style={{ display:'flex', gap:4, marginBottom:14 }}>
          {['Todos','Cível','Trabalhista'].map(r => (
            <button key={r} onClick={()=>{ setFiltroRamo(r); setFiltroTribunal('Todos'); }}
              style={{ padding:'7px 18px', borderRadius:8, border: filtroRamo===r ? '1px solid var(--blue)' : '1px solid var(--border)', background: filtroRamo===r ? 'rgba(59,130,246,.15)' : 'var(--surface)', color: filtroRamo===r ? '#93c5fd' : 'var(--muted)', fontSize:13, fontWeight: filtroRamo===r ? 700 : 400, cursor:'pointer' }}>
              {r === 'Cível' ? '🏛 Cível' : r === 'Trabalhista' ? '👷 Trabalhista' : '📋 Todos'}
            </button>
          ))}
        </div>
      )}

      <div style={{ display:'flex', gap:10, marginBottom:16, flexWrap:'wrap' }}>
        <input value={busca} onChange={e=>setBusca(e.target.value)} placeholder="Buscar por número ou parte..." style={{ width:280 }} />
        <select value={filtroFase} onChange={e=>setFiltroFase(e.target.value)} style={{ width:160 }}>
          <option>Todos</option>
          <option>Conhecimento</option>
          <option>Execução</option>
          <option>Arquivado</option>
        </select>
        <select value={filtroTribunal} onChange={e=>setFiltroTribunal(e.target.value)} style={{ width:140 }}>
          {tribunais.map(t => <option key={t}>{t}</option>)}
        </select>
      </div>

      <div style={{ background:'var(--surface)', border:'1px solid var(--border)', borderRadius:12, overflow:'hidden' }}>
        <table style={{ width:'100%', borderCollapse:'collapse' }}>
          <thead>
            <tr style={{ background:'var(--surface2)', fontSize:11, color:'var(--muted)', textTransform:'uppercase', letterSpacing:'.04em' }}>
              {['Número', 'Fase', 'Parte contrária', 'Tribunal / Órgão', 'Tramitação', 'Audiências'].map(h =>
                <th key={h} style={{ padding:'10px 14px', textAlign:'left', fontWeight:600 }}>{h}</th>
              )}
            </tr>
          </thead>
          <tbody>
            {lista.length === 0
              ? <tr><td colSpan={6} style={{ padding:40, textAlign:'center', color:'var(--muted)', fontSize:13 }}>Nenhum processo encontrado.</td></tr>
              : lista.map(p => {
                const fs = FASE_STYLE[p.fase] || {};
                const proxAud = (p.audiencias||[]).filter(a=>a.data >= new Date().toISOString().slice(0,10)).sort((a,b)=>a.data.localeCompare(b.data))[0];
                return (
                  <tr key={p.id} onClick={() => { setProcessoAberto(p); setView('detalhe'); }}
                    style={{ borderTop:'1px solid var(--border)', cursor:'pointer', transition:'background .15s' }}
                    onMouseEnter={e=>e.currentTarget.style.background='var(--surface2)'}
                    onMouseLeave={e=>e.currentTarget.style.background=''}>
                    <td style={{ padding:'11px 14px', fontFamily:'monospace', fontSize:12, color:'#93c5fd', maxWidth:200, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{p.numero}</td>
                    <td style={{ padding:'11px 14px' }}><Badge label={fs.label||p.fase} color={fs.color} bg={fs.bg} /></td>
                    <td style={{ padding:'11px 14px', fontSize:13, maxWidth:200, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{p.parte}</td>
                    <td style={{ padding:'11px 14px' }}><Badge label={p.tribunal} color="#94a3b8" bg="rgba(148,163,184,.1)" /></td>
                    <td style={{ padding:'11px 14px', fontSize:12, color:'var(--muted)', maxWidth:180, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{p.tramitacao}</td>
                    <td style={{ padding:'11px 14px', fontSize:12 }}>
                      {proxAud
                        ? <span style={{ color:'var(--green)' }}>📅 {fmtData(proxAud.data)}</span>
                        : <span style={{ color:'var(--muted)' }}>—</span>
                      }
                    </td>
                  </tr>
                );
              })
            }
          </tbody>
        </table>
      </div>
    </div>
  );
}

// ─── DETALHE DO PROCESSO ──────────────────────────────────────────────────────
function ProcessoDetalhe({ processo, onUpdate, onDelete, onBack }) {
  const [aba, setAba] = useState('notas');
  const [editando, setEditando] = useState(false);

  const addNota = (texto) => {
    const nova = { id:uid(), texto, autor:'Usuário', createdAt:now() };
    onUpdate({ ...processo, notas:[...( processo.notas||[]), nova], updatedAt:now() });
  };

  const delNota = (id) => {
    onUpdate({ ...processo, notas:(processo.notas||[]).filter(n=>n.id!==id), updatedAt:now() });
  };

  const addAudiencia = (aud) => {
    onUpdate({ ...processo, audiencias:[...(processo.audiencias||[]), { id:uid(), ...aud }], updatedAt:now() });
  };

  const delAudiencia = (id) => {
    onUpdate({ ...processo, audiencias:(processo.audiencias||[]).filter(a=>a.id!==id), updatedAt:now() });
  };

  const addArquivo = (arq) => {
    onUpdate({ ...processo, arquivos:[...(processo.arquivos||[]), { id:uid(), ...arq, addedAt:now() }], updatedAt:now() });
  };

  const delArquivo = (id) => {
    onUpdate({ ...processo, arquivos:(processo.arquivos||[]).filter(a=>a.id!==id), updatedAt:now() });
  };

  const fs = FASE_STYLE[processo.fase] || {};
  const ts = TIPO_STYLE[processo.tipo] || {};
  const ABAS = [
    { id:'notas', label:'📝 Notas', count: (processo.notas||[]).length },
    { id:'audiencias', label:'📅 Audiências', count: (processo.audiencias||[]).length },
    { id:'partes', label:'👥 Partes', count: (processo.partes||[]).length },
    { id:'arquivos', label:'📎 Arquivos', count: (processo.arquivos||[]).length },
    { id:'info', label:'ℹ️ Informações' },
  ];

  if (editando) return <ProcessoForm processo={processo} onSave={p=>{onUpdate(p);setEditando(false);}} onCancel={()=>setEditando(false)} />;

  return (
    <div style={{ flex:1, overflow:'auto', padding:28 }}>
      <div style={{ display:'flex', alignItems:'center', gap:10, marginBottom:20 }}>
        <button className="btn-ghost" onClick={onBack}>← Voltar</button>
        <div style={{ flex:1 }} />
        <button className="btn-secondary" onClick={()=>setEditando(true)}>✏️ Editar</button>
        <button className="btn-danger" onClick={()=>{ if(confirm('Excluir processo?')) onDelete(processo.id); }}>🗑️ Excluir</button>
      </div>

      <div style={{ background:'var(--surface)', border:'1px solid var(--border)', borderRadius:12, padding:20, marginBottom:16 }}>
        <div style={{ display:'flex', gap:8, marginBottom:10, flexWrap:'wrap' }}>
          <Badge label={ts.label} color={ts.color} bg={ts.bg} />
          <Badge label={fs.label||processo.fase} color={fs.color} bg={fs.bg} />
          <Badge label={processo.tribunal} color="#94a3b8" bg="rgba(148,163,184,.1)" />
        </div>
        <div style={{ fontFamily:'monospace', fontSize:16, fontWeight:700, color:'#93c5fd', marginBottom:6 }}>{processo.numero}</div>
        <div style={{ fontSize:18, fontWeight:700, marginBottom:4 }}>{processo.parte}</div>
        <div style={{ fontSize:13, color:'var(--muted)' }}>{processo.tramitacao}</div>
      </div>

      <div style={{ display:'flex', gap:4, marginBottom:16 }}>
        {ABAS.map(a => (
          <button key={a.id} onClick={()=>setAba(a.id)}
            style={{ padding:'8px 16px', borderRadius:8, border: aba===a.id ? '1px solid var(--blue)' : '1px solid var(--border)', background: aba===a.id ? 'rgba(59,130,246,.15)' : 'var(--surface)', color: aba===a.id ? '#93c5fd' : 'var(--muted)', fontSize:13, fontWeight: aba===a.id ? 700 : 400, cursor:'pointer' }}>
            {a.label}{a.count > 0 && <span style={{ marginLeft:6, fontSize:10, background:'var(--surface2)', borderRadius:99, padding:'1px 5px' }}>{a.count}</span>}
          </button>
        ))}
      </div>

      {aba === 'notas' && <TabNotas notas={processo.notas||[]} onAdd={addNota} onDel={delNota} />}
      {aba === 'audiencias' && <TabAudiencias audiencias={processo.audiencias||[]} onAdd={addAudiencia} onDel={delAudiencia} />}
      {aba === 'partes' && <TabPartes partes={processo.partes||[]} onUpdate={ps => onUpdate({...processo, partes:ps, updatedAt:now()})} />}
      {aba === 'arquivos' && <TabArquivos arquivos={processo.arquivos||[]} onAdd={addArquivo} onDel={delArquivo} />}
      {aba === 'info' && <TabInfo processo={processo} />}
    </div>
  );
}

// ─── ABA PARTES ───────────────────────────────────────────────────────────────
function TabPartes({ partes, onUpdate }) {
  const [adicionando, setAdicionando] = useState(false);
  const [form, setForm] = useState({ nome:'', documento:'', polo:'ativo', tipo_pessoa:'juridica' });
  const POLOS = [{ v:'ativo', label:'Polo Ativo', cor:'var(--green)' }, { v:'passivo', label:'Polo Passivo', cor:'var(--red)' }, { v:'outro', label:'Outro', cor:'var(--muted)' }];

  const adicionar = () => {
    if (!form.nome.trim()) return;
    onUpdate([...partes, { id:uid(), ...form }]);
    setForm({ nome:'', documento:'', polo:'ativo', tipo_pessoa:'juridica' });
    setAdicionando(false);
  };

  const remover = (id) => onUpdate(partes.filter(p => p.id !== id));

  const grupos = { ativo: partes.filter(p=>p.polo==='ativo'), passivo: partes.filter(p=>p.polo==='passivo'), outro: partes.filter(p=>p.polo==='outro') };

  return (
    <div>
      {POLOS.map(polo => grupos[polo.v].length > 0 && (
        <div key={polo.v} style={{ marginBottom:16 }}>
          <div style={{ fontSize:11, fontWeight:700, textTransform:'uppercase', letterSpacing:'.05em', color:polo.cor, marginBottom:8 }}>{polo.label}</div>
          {grupos[polo.v].map(pt => (
            <div key={pt.id} style={{ background:'var(--surface)', border:'1px solid var(--border)', borderRadius:8, padding:'10px 14px', marginBottom:6, display:'flex', alignItems:'center', gap:12 }}>
              <div style={{ flex:1 }}>
                <div style={{ fontWeight:600, fontSize:14 }}>{pt.nome}</div>
                {pt.documento && <div style={{ fontSize:12, color:'var(--muted)', marginTop:2, fontFamily:'monospace' }}>{pt.documento}</div>}
              </div>
              <button className="btn-ghost" onClick={() => remover(pt.id)} style={{ fontSize:14 }}>✕</button>
            </div>
          ))}
        </div>
      ))}

      {adicionando ? (
        <div style={{ background:'var(--surface)', border:'1px solid var(--border)', borderRadius:10, padding:16, marginTop:8 }}>
          <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:10, marginBottom:10 }}>
            <div className="field" style={{ gridColumn:'1/-1' }}><label>Nome *</label><input value={form.nome} onChange={e=>setForm({...form,nome:e.target.value})} placeholder="Nome completo" autoFocus /></div>
            <div className="field"><label>CPF / CNPJ</label><input value={form.documento} onChange={e=>setForm({...form,documento:e.target.value})} placeholder="000.000.000-00" /></div>
            <div className="field"><label>Tipo</label>
              <select value={form.tipo_pessoa} onChange={e=>setForm({...form,tipo_pessoa:e.target.value})}>
                <option value="juridica">Pessoa Jurídica</option>
                <option value="fisica">Pessoa Física</option>
              </select>
            </div>

// ─── ABA ARQUIVOS ─────────────────────────────────────────────────────────────
function TabArquivos({ arquivos, onAdd, onDel }) {
  const inputRef = useRef();
  const [urlForm, setUrlForm] = useState({ nome:'', url:'' });
  const [modoUrl, setModoUrl] = useState(false);

  const handleFile = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > 5 * 1024 * 1024) { alert('Arquivo muito grande. Máximo: 5 MB.'); return; }
    const reader = new FileReader();
    reader.onload = ev => onAdd({ nome:file.name, tipo:file.type, tamanho:file.size, base64:ev.target.result, url:null });
    reader.readAsDataURL(file);
    e.target.value = '';
  };

  const handleUrl = () => {
    if (!urlForm.nome || !urlForm.url) return;
    onAdd({ nome:urlForm.nome, tipo:'link', tamanho:0, base64:null, url:urlForm.url });
    setUrlForm({ nome:'', url:'' });
    setModoUrl(false);
  };

  const fileIcon = (tipo) => {
    if (!tipo) return '📄';
    if (tipo.includes('pdf')) return '📕';
    if (tipo.includes('word') || tipo.includes('docx')) return '📝';
    if (tipo.includes('sheet') || tipo.includes('xlsx')) return '📊';
    if (tipo.includes('image')) return '🖼️';
    if (tipo === 'link') return '🔗';
    return '📄';
  };

  return (
    <div>
      <div style={{ display:'flex', gap:8, marginBottom:16 }}>
        <button className="btn-primary" onClick={()=>inputRef.current.click()}>📎 Anexar arquivo</button>
        <button className="btn-secondary" onClick={()=>setModoUrl(!modoUrl)}>🔗 Adicionar link</button>
        <input ref={inputRef} type="file" style={{ display:'none' }} onChange={handleFile} />
      </div>

      {modoUrl && (
        <div style={{ background:'var(--surface)', border:'1px solid var(--border)', borderRadius:10, padding:16, marginBottom:12, display:'flex', gap:10, alignItems:'flex-end' }}>
          <div className="field" style={{ flex:1 }}><label>Nome / descrição</label><input value={urlForm.nome} onChange={e=>setUrlForm({...urlForm,nome:e.target.value})} placeholder="ex: Petição Inicial" /></div>
          <div className="field" style={{ flex:2 }}><label>URL (SharePoint, OneDrive, etc.)</label><input value={urlForm.url} onChange={e=>setUrlForm({...urlForm,url:e.target.value})} placeholder="https://..." /></div>
          <button className="btn-primary" onClick={handleUrl} disabled={!urlForm.nome||!urlForm.url}>Salvar</button>
          <button className="btn-secondary" onClick={()=>setModoUrl(false)}>✕</button>
        </div>
      )}

      <div style={{ fontSize:11, color:'var(--muted)', marginBottom:12 }}>
        Arquivos salvos no navegador (máx. 5 MB por arquivo). Para arquivos grandes, use links.
      </div>

      {arquivos.map(a => (
        <div key={a.id} style={{ background:'var(--surface)', border:'1px solid var(--border)', borderRadius:10, padding:'12px 16px', marginBottom:8, display:'flex', gap:12, alignItems:'center' }}>
          <span style={{ fontSize:24 }}>{fileIcon(a.tipo)}</span>
          <div style={{ flex:1 }}>
            <div style={{ fontWeight:600, fontSize:13 }}>{a.nome}</div>
            <div style={{ fontSize:11, color:'var(--muted)' }}>{a.tipo === 'link' ? 'Link externo' : fmtTamanho(a.tamanho)} · {fmtDataHora(a.addedAt)}</div>
          </div>
          {a.base64 && <a href={a.base64} download={a.nome} style={{ color:'var(--blue)', fontSize:12, textDecoration:'none', padding:'4px 10px', border:'1px solid rgba(59,130,246,.3)', borderRadius:6 }}>Baixar</a>}
          {a.url && <a href={a.url} target="_blank" style={{ color:'var(--blue)', fontSize:12, textDecoration:'none', padding:'4px 10px', border:'1px solid rgba(59,130,246,.3)', borderRadius:6 }}>Abrir</a>}
          <button className="btn-ghost" onClick={()=>onDel(a.id)} style={{ fontSize:14 }}>✕</button>
        </div>
      ))}
      {arquivos.length === 0 && <div style={{ color:'var(--muted)', fontSize:13, textAlign:'center', padding:'32px 0' }}>Nenhum arquivo anexado.</div>}
    </div>
  );
}

// ─── AGENDA ───────────────────────────────────────────────────────────────────
function Agenda({ processos, setProcessoAberto, setView }) {
  const [mes, setMes] = useState(() => new Date().toISOString().slice(0,7));
  const [mesDate, setMesDate] = useState(() => new Date());

  const mudarMes = (delta) => {
    const d = new Date(mesDate.getFullYear(), mesDate.getMonth() + delta, 1);
    setMesDate(d);
    setMes(d.toISOString().slice(0,7));
  };

  const audiencias = processos.flatMap(p =>
    (p.audiencias||[]).filter(a => a.data.startsWith(mes)).map(a => ({ ...a, processo: p }))
  ).sort((a,b) => a.data.localeCompare(b.data));

  const dias = {};
  audiencias.forEach(a => { if (!dias[a.data]) dias[a.data] = []; dias[a.data].push(a); });

  const hoje = new Date().toISOString().slice(0,10);
  const nomeMes = mesDate.toLocaleDateString('pt-BR', { month:'long', year:'numeric' });

  return (
    <div style={{ flex:1, overflow:'auto', padding:28 }}>
      <div style={{ display:'flex', alignItems:'center', gap:16, marginBottom:24 }}>
        <button className="btn-secondary" onClick={()=>mudarMes(-1)}>←</button>
        <div style={{ fontWeight:800, fontSize:18, textTransform:'capitalize', minWidth:200, textAlign:'center' }}>{nomeMes}</div>
        <button className="btn-secondary" onClick={()=>mudarMes(1)}>→</button>
        <div style={{ marginLeft:'auto', fontSize:13, color:'var(--muted)' }}>{audiencias.length} audiência(s) neste mês</div>
      </div>

      {Object.keys(dias).length === 0 ? (
        <div style={{ background:'var(--surface)', border:'1px solid var(--border)', borderRadius:12, padding:48, textAlign:'center', color:'var(--muted)' }}>
          <div style={{ fontSize:48, marginBottom:12 }}>📅</div>
          <div>Nenhuma audiência em {nomeMes}.</div>
        </div>
      ) : (
        Object.entries(dias).map(([data, auds]) => (
          <div key={data} style={{ marginBottom:16 }}>
            <div style={{ display:'flex', alignItems:'center', gap:10, marginBottom:8 }}>
              <div style={{ fontWeight:700, fontSize:15, color: data === hoje ? 'var(--green)' : 'var(--text)' }}>
                {data === hoje && '🟢 '}{fmtDataExtenso(data)}
              </div>
              <div style={{ flex:1, height:1, background:'var(--border)' }} />
            </div>
            {auds.map(a => (
              <div key={a.id} onClick={() => { setProcessoAberto(a.processo); setView('detalhe'); }}
                style={{ background:'var(--surface)', border:'1px solid rgba(59,130,246,.3)', borderRadius:10, padding:'12px 16px', marginBottom:6, cursor:'pointer', display:'flex', gap:14, alignItems:'center' }}
                onMouseEnter={e=>e.currentTarget.style.borderColor='var(--blue)'}
                onMouseLeave={e=>e.currentTarget.style.borderColor='rgba(59,130,246,.3)'}>
                <div style={{ fontWeight:700, color:'var(--blue)', minWidth:50, fontSize:14 }}>{a.hora||'—'}</div>
                <div style={{ flex:1 }}>
                  <div style={{ fontWeight:600, fontSize:14 }}>{a.tipo}</div>
                  <div style={{ fontSize:12, color:'var(--muted)' }}>{a.processo.parte} · {a.processo.tribunal}</div>
                  {a.local && <div style={{ fontSize:11, color:'var(--muted)', marginTop:2 }}>📍 {a.local}</div>}
                </div>
                <Badge label={TIPO_STYLE[a.processo.tipo]?.label} color={TIPO_STYLE[a.processo.tipo]?.color} bg={TIPO_STYLE[a.processo.tipo]?.bg} />
              </div>
            ))}
          </div>
        ))
      )}
    </div>
  );
}

// ─── IA JURÍDICA ──────────────────────────────────────────────────────────────
function IAChat({ processos, claudeKey }) {
  const [msgs, setMsgs] = useState([
    { role:'assistant', content:'Olá! Sou seu assistente jurídico. Posso analisar seus processos, identificar prazos críticos, resumir situações e responder perguntas sobre seu portfólio jurídico. Como posso ajudar?' }
  ]);
  const [input, setInput] = useState('');
  const [loading, setLoading] = useState(false);
  const endRef = useRef();
  const containerRef = useRef();

  useEffect(() => {
    if (containerRef.current) {
      containerRef.current.scrollTop = containerRef.current.scrollHeight;
    }
  }, [msgs, loading]);

  const buildContext = () => {
    const ativos = processos.filter(p => p.fase !== 'Arquivado');
    const hoje = new Date().toISOString().slice(0,10);
    const proxAuds = processos.flatMap(p =>
      (p.audiencias||[]).filter(a => a.data >= hoje).map(a => `${a.data} - ${a.tipo} (${p.numero} / ${p.parte})`)
    ).slice(0,10);

    const lista = ativos.map(p => {
      const notas = (p.notas||[]).slice(-3).map(n=>n.texto).join('; ');
      return `[${p.tipo.toUpperCase()}] ${p.numero} | Fase: ${p.fase} | Parte: ${p.parte} | ${p.tribunal} | ${p.tramitacao}${notas ? ` | Notas: ${notas}` : ''}`;
    }).join('\n');

    return `Você é o assistente jurídico interno da empresa DB Machado LTDA / Rede Forte Construções.

PROCESSOS ATIVOS (${ativos.length} de ${processos.length} total):
${lista}

PRÓXIMAS AUDIÊNCIAS:
${proxAuds.length ? proxAuds.join('\n') : 'Nenhuma audiência agendada'}

Responda em português, de forma objetiva e direta. Destaque urgências e prazos críticos quando relevante.`;
  };

  const enviar = async () => {
    if (!input.trim() || loading) return;
    if (!claudeKey) { setMsgs(m=>[...m, { role:'assistant', content:'⚙️ Configure a chave da API Claude em Configurações para usar a IA.' }]); setInput(''); return; }

    const novaMsg = { role:'user', content:input.trim() };
    setMsgs(m => [...m, novaMsg]);
    setInput('');
    setLoading(true);

    try {
      const history = msgs.filter(m=>m.role!=='system').slice(-8);
      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method:'POST',
        headers:{
          'x-api-key': claudeKey,
          'anthropic-version': '2023-06-01',
          'content-type': 'application/json',
          'anthropic-dangerous-direct-browser-access': 'true',
        },
        body: JSON.stringify({
          model:'claude-sonnet-4-6',
          max_tokens: 1024,
          system: buildContext(),
          messages: [...history, novaMsg],
        })
      });
      if (!res.ok) { const e = await res.json(); throw new Error(e.error?.message || 'Erro na API'); }
      const data = await res.json();
      setMsgs(m => [...m, { role:'assistant', content: data.content[0].text }]);
    } catch(e) {
      setMsgs(m => [...m, { role:'assistant', content:`❌ Erro: ${e.message}` }]);
    } finally { setLoading(false); }
  };

  const sugestoes = ['Quais processos têm prazo urgente?', 'Resumo das execuções em andamento', 'Processos com descumprimento de acordo', 'Situação dos processos no TRT10', 'Análise de risco geral'];

  return (
    <div style={{ flex:1, display:'flex', flexDirection:'column', padding:28, gap:16 }}>
      <div style={{ fontWeight:800, fontSize:18 }}>🤖 IA Jurídica</div>
      {!claudeKey && (
        <div style={{ background:'rgba(245,158,11,.08)', border:'1px solid rgba(245,158,11,.3)', borderRadius:10, padding:'10px 14px', fontSize:13, color:'#fcd34d' }}>
          ⚙️ Configure a chave Claude em <strong>Configurações</strong> para ativar a IA.
        </div>
      )}
      <div ref={containerRef} style={{ flex:1, background:'var(--surface)', border:'1px solid var(--border)', borderRadius:12, padding:16, overflowY:'auto', display:'flex', flexDirection:'column', gap:12, minHeight:0 }}>
        {msgs.map((m,i) => (
          <div key={i} style={{ display:'flex', justifyContent: m.role==='user' ? 'flex-end' : 'flex-start' }}>
            <div style={{ maxWidth:'80%', padding:'10px 14px', borderRadius:12, background: m.role==='user' ? 'linear-gradient(135deg,var(--blue),#1d4ed8)' : 'var(--surface2)', color:'var(--text)', fontSize:13, lineHeight:1.6, border: m.role==='assistant' ? '1px solid var(--border)' : 'none', whiteSpace:'pre-wrap' }}>

// ─── UTILITÁRIOS ──────────────────────────────────────────────────────────────
function fmtData(s) {
  if (!s) return '—';
  const [y,m,d] = s.split('-');
  return `${d}/${m}/${y}`;
}
function fmtDataExtenso(s) {
  if (!s) return '';
  return new Date(s + 'T12:00:00').toLocaleDateString('pt-BR', { weekday:'long', day:'numeric', month:'long' });
}
function fmtDataHora(s) {
  if (!s) return '—';
  return new Date(s).toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
}
function fmtTamanho(b) {
  if (!b) return '';
  if (b < 1024) return `${b} B`;
  if (b < 1024*1024) return `${(b/1024).toFixed(1)} KB`;
  return `${(b/1024/1024).toFixed(1)} MB`;
}

// ─── APP PRINCIPAL ────────────────────────────────────────────────────────────
function App() {
  const [user, setUser] = useState(null);
  const [processos, setProcessos] = useState([]);
  const [config, setConfig] = useState({ claudeKey: window.CLAUDE_KEY || '' });
  const [carregando, setCarregando] = useState(true);
  const [erroSB, setErroSB] = useState(null);
  const [view, setView] = useState('dashboard');
  const [processoAberto, setProcessoAberto] = useState(null);
  const [adicionando, setAdicionando] = useState(null);
  const [showDJE, setShowDJE] = useState(false);

  useEffect(() => {
    if (!sbClient) {
      // Sem Supabase: carrega localStorage direto
      const local = loadData();
      setProcessos(local.processos || []);
      setConfig(local.config || { claudeKey: window.CLAUDE_KEY || '' });
      setCarregando(false);
      return;
    }

    // Verifica sessão existente
    sbClient.auth.getSession().then(({ data: { session } }) => {
      if (session?.user) {
        setUser(session.user);
        carregarDados();
      } else {
        setCarregando(false);
      }
    });

    // Escuta mudanças de auth
    const { data: { subscription } } = sbClient.auth.onAuthStateChange((event, session) => {
      if (event === 'SIGNED_IN' && session?.user) {
        setUser(session.user);
        carregarDados();
      } else if (event === 'SIGNED_OUT') {
        setUser(null);
        setProcessos([]);
        setView('dashboard');
      }
    });

    return () => subscription.unsubscribe();
  }, []);

  const carregarDados = async () => {
    setCarregando(true);
    try {
      const dados = await sb_carregar();
      setProcessos(dados);
      setErroSB(null);
    } catch(e) {
      console.error('Supabase:', e);
      setErroSB(e.message);
    } finally {
      setCarregando(false);
    }
  };

  const logout = async () => {
    await sbClient.auth.signOut();
  };

  const salvarSB = async (proc) => {
    if (!sbClient) return null;
    try {
      return await sb_salvar(proc);
    } catch(e) {
      const msg = e?.message || e?.details || JSON.stringify(e);
      console.error('Supabase save error:', e);
      setErroSB('Erro ao salvar: ' + msg);
      return null;
    }
  };

  const updateProcesso = useCallback(async (proc) => {
    setProcessos(prev => prev.map(p => p.id === proc.id ? proc : p));
    if (processoAberto?.id === proc.id) setProcessoAberto(proc);
    if (sbClient) await salvarSB(proc);
    else saveData({ processos: processos.map(p => p.id === proc.id ? proc : p), config });
  }, [processos, processoAberto, config]);

  const addProcesso = useCallback(async (proc) => {
    const saved = sbClient ? (await salvarSB(proc) || proc) : proc;
    if (!sbClient) saveData({ processos: [proc, ...processos], config });
    setProcessos(prev => [saved, ...prev.filter(p => p.id !== saved.id)]);
    setAdicionando(null);
    setProcessoAberto(saved);
    setView('detalhe');
  }, [processos, config]);

  const delProcesso = useCallback(async (id) => {
    if (sbClient) { try { await sb_deletar(id); } catch(e) { setErroSB('Erro ao deletar: ' + e.message); } }
    else saveData({ processos: processos.filter(p => p.id !== id), config });
    setProcessos(prev => prev.filter(p => p.id !== id));
    setProcessoAberto(null);
    setView('dashboard');
  }, [processos, config]);

  const saveConfig = useCallback((cfg) => {
    setConfig(cfg);
    saveData({ processos, config: cfg });
  }, [processos]);

  const migrarLocalParaSB = async () => {
    if (!sbClient) return;
    const local = loadData();
    if (!local.processos?.length) { alert('Nenhum dado local para migrar.'); return; }
    if (!confirm(`Migrar ${local.processos.length} processos do localStorage para o Supabase?`)) return;
    try {
      await sb_migrar(local.processos);
      const dados = await sb_carregar();
      setProcessos(dados);
      alert('Migração concluída!');
    } catch(e) { alert('Erro na migração: ' + e.message); }
  };

  const counts = {
    juridico: processos.filter(p=>p.tipo==='juridico'&&p.fase!=='Arquivado').length,
    adm: processos.filter(p=>p.tipo==='administrativo'&&p.fase!=='Arquivado').length,
    agenda: processos.flatMap(p=>(p.audiencias||[]).filter(a=>a.data>=new Date().toISOString().slice(0,10))).length,
  };

  // Sem sessão → mostra login
  if (sbClient && !user && !carregando) return <Login />;

  if (carregando) return (
    <div style={{ flex:1, display:'flex', alignItems:'center', justifyContent:'center', flexDirection:'column', gap:16, color:'var(--muted)', minHeight:'100vh' }}>
      <div style={{ fontSize:40 }}>⚖️</div>
      <div style={{ fontSize:14 }}>Carregando{user ? ' dados' : ''}...</div>
    </div>
  );

  let mainContent;
  if (adicionando) {
    mainContent = <ProcessoForm onSave={addProcesso} onCancel={()=>setAdicionando(null)} processo={null} />;
  } else if (view === 'detalhe' && processoAberto) {
    mainContent = <ProcessoDetalhe processo={processoAberto} onUpdate={updateProcesso} onDelete={delProcesso} onBack={() => { setView(processoAberto.tipo === 'juridico' ? 'juridico' : 'adm'); setProcessoAberto(null); }} />;
  } else if (view === 'dashboard') {
    mainContent = <Dashboard processos={processos} setView={setView} setProcessoAberto={setProcessoAberto} />;
  } else if (view === 'juridico') {
    mainContent = <ProcessoList processos={processos} tipo="juridico" setProcessoAberto={setProcessoAberto} setView={setView} onAdd={()=>setAdicionando('juridico')} onImportDJE={()=>setShowDJE(true)} />;
  } else if (view === 'adm') {
    mainContent = <ProcessoList processos={processos} tipo="administrativo" setProcessoAberto={setProcessoAberto} setView={setView} onAdd={()=>setAdicionando('administrativo')} onImportDJE={()=>setShowDJE(true)} />;
  } else if (view === 'agenda') {
    mainContent = <Agenda processos={processos} setProcessoAberto={setProcessoAberto} setView={setView} />;
  } else if (view === 'ia') {
    mainContent = <IAChat processos={processos} claudeKey={config.claudeKey} />;
  } else if (view === 'config') {
    mainContent = <Configuracoes config={config} onSave={saveConfig} onMigrar={migrarLocalParaSB} supabaseOk={!!sbClient && !erroSB} erroSB={erroSB} />;
  }

  return (
    <React.Fragment>
      <Sidebar view={adicionando ? '' : view} setView={(v)=>{setView(v);setAdicionando(null);setProcessoAberto(null);}} counts={counts} user={user} onLogout={logout} />
      <div style={{ flex:1, display:'flex', flexDirection:'column', minWidth:0 }}>
        {erroSB && (
          <div style={{ background:'rgba(239,68,68,.08)', borderBottom:'1px solid rgba(239,68,68,.2)', padding:'8px 20px', fontSize:12, color:'var(--red)', display:'flex', gap:10, alignItems:'center' }}>
            ⚠️ Supabase offline — usando dados locais. {erroSB}
            <button className="btn-ghost" style={{ fontSize:11, marginLeft:'auto' }} onClick={inicializar}>Reconectar</button>
          </div>
        )}
        {mainContent}
      </div>
      {showDJE && (
        <ModalDJE
          claudeKey={config.claudeKey}
          processos={processos}
          onFechar={() => setShowDJE(false)}
          onSalvar={async ({ tipo, processo }) => {
            if (tipo === 'criar') await addProcesso(processo);
            else await updateProcesso(processo);
          }}
          onConcluido={(ultimo) => {
            setShowDJE(false);
            if (ultimo) { setProcessoAberto(ultimo); setView('detalhe'); }
          }}
        />
      )}
    </React.Fragment>
  );
}

// ─── PDF.JS WORKER ───────────────────────────────────────────────────────────
if (typeof pdfjsLib !== 'undefined') {
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
}

// ─── EXTRAÇÃO DE TEXTO DO PDF ─────────────────────────────────────────────────
async function extrairTextoPDF(file) {
  const arrayBuffer = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  let texto = '';
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    texto += content.items.map(item => item.str).join(' ') + ' ';
  }
  return { texto, numPages: pdf.numPages, escaneado: texto.replace(/\s/g,'').length < 120 };
}

// Renderiza páginas do PDF como imagens base64 (para PDFs escaneados)
async function pdfParaImagens(file, maxPaginas = 3) {
  const arrayBuffer = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  const paginas = Math.min(pdf.numPages, maxPaginas);
  const imagens = [];
  for (let i = 1; i <= paginas; i++) {
    const page = await pdf.getPage(i);
    const viewport = page.getViewport({ scale: 1.8 });
    const canvas = document.createElement('canvas');
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
    imagens.push(canvas.toDataURL('image/jpeg', 0.85).split(',')[1]);
  }
  return imagens;
}

// Usa Claude Vision para extrair dados de PDF escaneado
async function extrairComIA(file, claudeKey) {
  const imagens = await pdfParaImagens(file);
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'x-api-key': claudeKey,
      'anthropic-version': '2023-06-01',
      'content-type': 'application/json',
      'anthropic-dangerous-direct-browser-access': 'true',
    },
    body: JSON.stringify({
      model: 'claude-opus-4-8',
      max_tokens: 512,
      messages: [{
        role: 'user',
        content: [
          ...imagens.map(img => ({ type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: img } })),
          { type: 'text', text: `Este é um documento do DJE (Diário da Justiça Eletrônico) brasileiro. Extraia as seguintes informações em JSON:
{
  "numero": "número do processo no formato NNNNNNN-DD.AAAA.J.TT.OOOO",
  "tribunal": "sigla do tribunal (ex: TRT18, TJGO)",
  "vara": "vara ou unidade judiciária",
  "autor": "nome do autor/reclamante (parte contrária)",
  "dataAudiencia": "DD/MM/AAAA ou vazio",
  "horaAudiencia": "HH:MM ou vazio",
  "tipoAudiencia": "tipo da audiência",
  "local": "link de videoconferência ou Presencial"
}
Responda APENAS o JSON, sem explicações.` }
        ]
      }]
    })
  });
  if (!res.ok) throw new Error('Erro na API Claude');
  const data = await res.json();
  const json = JSON.parse(data.content[0].text.match(/\{[\s\S]*\}/)[0]);

  // Converte para o formato interno
  let data_ = '', hora = '';
  if (json.dataAudiencia) {
    const [d, m, y] = json.dataAudiencia.split('/');
    data_ = `${y}-${m}-${d}`;
    hora = json.horaAudiencia || '';
  }
  return {
    num: json.numero || '',
    tribunal: json.tribunal || '',
    vara: json.vara || '',
    autor: json.autor || '',
    data: data_,
    hora,
    tipoAud: json.tipoAudiencia || 'Audiência',
    local: json.local || '',
  };
}

// ─── PARSER DE DJE ───────────────────────────────────────────────────────────
function parsearDJE(texto) {
  const t = texto.replace(/\s+/g, ' ');

  // Número do processo (formato CNJ)
  const num = (t.match(/(\d{7}-\d{2}\.\d{4}\.\d\.\d{2}\.\d{4})/) || [])[1] || '';

  // Tribunal TRT
  const trtM = t.match(/TRABALHO DA\s+(\d+)[ªa°]?\s*REGI/i);
  const tribunal = trtM ? `TRT${String(parseInt(trtM[1])).padStart(2,'0')}` : '';

  // Vara do trabalho
  const varaM = t.match(/((?:\d+[ªa°]?\s+)?(?:VARA|POSTO)\s+(?:AVANÇADO\s+DE\s+\w+|DO\s+TRABALHO[^,\.]{2,40}?))\s*(?:-\s*[A-Z]{2})?/i);
  const vara = varaM ? varaM[0].replace(/\s+/g, ' ').trim().slice(0, 60) : '';

  // Autor/Reclamante — a parte contrária (quem processa a DB Machado)
  const autorM = t.match(/(?:AUTOR|RECLAMANTE):\s*([A-ZÁÊÇÕÃÂÍÓÚ][^\|]{3,60}?)(?=\s+R[EÉ]U|\s+RECLAMADO|\s+DEST)/i)
               || t.match(/(?:AUTOR|RECLAMANTE):\s*([A-ZÁÊÇÕÃÂÍÓÚ][^\n\r]{3,60})/i);
  const autor = autorM ? autorM[1].replace(/\s+/g, ' ').trim().split(/\s{2,}/)[0] : '';

  // Data — múltiplos formatos
  const dataM = t.match(/(\d{2}\/\d{2}\/\d{4})[,\s]+(?:às\s+|às)?(\d{2})(?:h|:)(\d{2})/i)
             || t.match(/dia\s+(\d{2}\/\d{2}\/\d{4})[,\s]+(\d{2}):(\d{2})/i);
  let data = '', hora = '';
  if (dataM) {
    const [d, m, y] = dataM[1].split('/');
    data = `${y}-${m}-${d}`;
    hora = `${dataM[2]}:${dataM[3]}`;
  }

  // Link da audiência
  const linkM = t.match(/(https?:\/\/[^\s"'<>]+(?:zoom|meet|teams)[^\s"'<>]*)/i);
  const link = linkM ? linkM[1] : '';

  // Tipo e local da audiência
  const tipoAud = /AUDI[EÊ]NCIA INICIAL/i.test(t) ? 'Audiência Inicial' :
                  /CONCILIA[CÇ]/i.test(t) ? 'Conciliação' :
                  /INSTRU[CÇ][AÃ]O/i.test(t) ? 'Instrução' : 'Audiência';
  const local = /VIRTUAL|ZOOM|videoconfer|telepresencial|100% DIGITAL/i.test(t)
    ? (link || 'Videoconferência')
    : /PRESENCIAL/i.test(t) ? 'Presencial' : link || '';

  return { num, tribunal, vara: vara || '', autor, data, hora, tipoAud, local, link };
}

// ─── COMPRESSÃO DO ARQUIVO ────────────────────────────────────────────────────
async function comprimirArquivo(arrayBuffer) {
  try {
    if (!window.CompressionStream) return null;
    const cs = new CompressionStream('gzip');
    const writer = cs.writable.getWriter();
    writer.write(new Uint8Array(arrayBuffer));
    writer.close();
    const chunks = [];
    const reader = cs.readable.getReader();
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      chunks.push(value);
    }
    const total = chunks.reduce((a, b) => a + b.length, 0);
    const result = new Uint8Array(total);
    let offset = 0;
    chunks.forEach(c => { result.set(c, offset); offset += c.length; });
    return result;
  } catch { return null; }
}

function uint8ToBase64(u8) {
  let bin = '';
  u8.forEach(b => bin += String.fromCharCode(b));
  return btoa(bin);
}

// ─── HELPER: processa um único arquivo e retorna { tipo, processo } ──────────
async function processarUmArquivo(file, processos, claudeKey) {
  const arrayBuffer = await file.arrayBuffer();
  const { texto, escaneado } = await extrairTextoPDF(file);

  let dados;
  if (!escaneado) {
    dados = parsearDJE(texto);
  } else {
    if (!claudeKey) throw new Error('SEMCHAVE');
    dados = await extrairComIA(file, claudeKey);
  }

  const comprimido = await comprimirArquivo(arrayBuffer);
  const base64 = comprimido
    ? 'data:application/gzip;base64,' + uint8ToBase64(comprimido)
    : 'data:application/pdf;base64,' + uint8ToBase64(new Uint8Array(arrayBuffer));

  const arq = {
    id: uid(), nome: file.name,
    tipo: comprimido ? 'application/gzip' : 'application/pdf',
    tamanho: file.size, tamanhoComprimido: comprimido ? comprimido.length : file.size,
    base64, url: null, addedAt: now(),
  };
  const aud = dados.data ? [{
    id: uid(), data: dados.data, hora: dados.hora,
    tipo: dados.tipoAud, local: dados.local, obs: '',
  }] : [];

  const existente = dados.num && processos.find(p =>
    p.numero.replace(/[\s.\-\/]/g,'') === dados.num.replace(/[\s.\-\/]/g,'')
  );

  if (existente) {
    const atualizado = {
      ...existente,
      audiencias: [...(existente.audiencias||[]), ...aud],
      arquivos:   [...(existente.arquivos||[]), arq],
      notas: [...(existente.notas||[]), {
        id: uid(),
        texto: `Notificação recebida${dados.data ? ` — Audiência ${dados.tipoAud} em ${fmtData(dados.data)}${dados.hora?' às '+dados.hora:''}` : ''}`,
        autor: 'Importado', createdAt: now(),
      }],
      updatedAt: now(),
    };
    return { tipo: 'atualizar', processo: atualizado, num: dados.num, parte: dados.autor };
  } else {
    const proc = {
      id: uid(), numero: dados.num || file.name, tipo: 'juridico', fase: 'Conhecimento',
      parte: dados.autor, tribunal: dados.tribunal, tramitacao: dados.vara,
      audiencias: aud, arquivos: [arq], notas: [],
      createdAt: now(), updatedAt: now(),
    };
    return { tipo: 'criar', processo: proc, num: dados.num, parte: dados.autor };
  }
}

// ─── MODAL DE IMPORT DJE ─────────────────────────────────────────────────────
function ModalDJE({ onSalvar, onFechar, onConcluido, claudeKey, processos }) {
  const [estado, setEstado] = useState('idle'); // idle | processando | revisao | concluido
  const [fila, setFila] = useState([]);       // { file, status, resultado, erro }
  const [atual, setAtual] = useState(0);
  // revisão de arquivo único
  const [form, setForm] = useState(null);
  const [arqInfo, setArqInfo] = useState(null);
  const inputRef = useRef();

  const extraidosRef  = useRef([]);
  const indiceRef     = useRef(0);
  const decisoesRef   = useRef([]);
  const [ultimoSalvo, setUltimoSalvo] = useState(null);

  const formParaProcesso = (f) => {
    const r = f._resultado;
    const aud = f.audData ? [{ id: uid(), data: f.audData, hora: f.audHora, tipo: f.audTipo, local: f.audLocal, obs: '' }] : [];
    return {
      ...r.processo,
      numero: f.numero, tipo: f.tipo, fase: f.fase, parte: f.parte,
      tribunal: f.tribunal, tramitacao: f.tramitacao,
      audiencias: r.tipo === 'atualizar'
        ? [...(r.processo.audiencias||[]).filter(a => !aud.find(b => b.data === a.data)), ...aud]
        : aud,
    };
  };

  const iniciarProcessamento = async (files) => {
    const lista = Array.from(files).filter(f => f.name.endsWith('.pdf'));
    if (!lista.length) return;

    setEstado('processando');
    setFila(lista.map(f => ({ nome: f.name, status: 'aguardando' })));

    const extraidos = [];
    for (let i = 0; i < lista.length; i++) {
      setAtual(i);
      setFila(prev => prev.map((item, idx) => idx === i ? { ...item, status: 'processando' } : item));
      try {
        const resultado = await processarUmArquivo(lista[i], processos, claudeKey);
        extraidos.push({ nome: lista[i].name, resultado });
        setFila(prev => prev.map((item, idx) => idx === i ? { ...item, status: 'lido' } : item));
      } catch(e) {
        setFila(prev => prev.map((item, idx) => idx === i ? { ...item, status: 'erro', erro: e.message } : item));
      }
    }

    if (!extraidos.length) { setEstado('concluido'); return; }

    extraidosRef.current = extraidos;
    decisoesRef.current  = new Array(extraidos.length).fill(null);
    indiceRef.current    = 0;
    abrirItem(0);
  };

  const abrirItem = (idx) => {
    const item = extraidosRef.current[idx];
    const decisaoSalva = decisoesRef.current[idx];
    // Restaura form anterior se o usuário já tinha editado este item
    if (decisaoSalva?.form) {
      setForm(decisaoSalva.form);
    } else {
      const p = item.resultado.processo;
      const aud = p.audiencias?.[0];
      setForm({
        numero: p.numero, tipo: p.tipo, fase: p.fase, parte: p.parte,
        tribunal: p.tribunal, tramitacao: p.tramitacao,
        audData: aud?.data||'', audHora: aud?.hora||'',
        audTipo: aud?.tipo||'Audiência', audLocal: aud?.local||'',
        _resultado: item.resultado,
      });
    }
    setEstado('revisao');
  };

  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));

  const avancarDecisao = (acao) => {
    const idx = indiceRef.current;
    decisoesRef.current[idx] = { acao, form };
    const proximo = idx + 1;
    if (proximo < extraidosRef.current.length) {
      indiceRef.current = proximo;
      abrirItem(proximo);
    } else {
      setEstado('resumo'); // todos revisados → mostra lista de confirmação
    }
  };

  const confirmarAtual = () => avancarDecisao('salvar');
  const pularAtual     = () => avancarDecisao('pular');

  const voltarAnterior = () => {
    const origem = estado === 'resumo' ? extraidosRef.current.length - 1 : indiceRef.current - 1;
    decisoesRef.current[indiceRef.current] = { acao: decisoesRef.current[indiceRef.current]?.acao || 'pendente', form };
    indiceRef.current = origem;
    abrirItem(origem);
  };

  const finalizarTudo = async () => {
    const decisoes = decisoesRef.current;
    let ultimoSalvo = null;
    for (const d of decisoes) {
      if (d?.acao === 'salvar') {
        await onSalvar({ tipo: d.form._resultado.tipo, processo: formParaProcesso(d.form) });
        ultimoSalvo = formParaProcesso(d.form);
      }
    }
    setFila(prev => prev.map((item, i) => {
      const d = decisoes[i];
      if (!d) return item;
      return { ...item, status: d.acao === 'salvar' ? 'ok' : 'pulado', resultado: d.form?._resultado };
    }));
    setUltimoSalvo(ultimoSalvo);
    setEstado('concluido');
  };

  return (
    <div style={{ position:'fixed', inset:0, background:'rgba(0,0,0,.7)', display:'flex', alignItems:'center', justifyContent:'center', zIndex:1000 }}>
      <div style={{ background:'var(--surface)', border:'1px solid var(--border)', borderRadius:16, padding:28, width:620, maxWidth:'95vw', maxHeight:'90vh', overflow:'auto' }}>
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:20 }}>
          <div style={{ fontWeight:800, fontSize:17 }}>📄 Importar Notificação</div>
          <button className="btn-ghost" onClick={onFechar} style={{ fontSize:18 }}>✕</button>
        </div>

        {estado === 'idle' && (
          <div>
            <div
              onClick={() => inputRef.current.click()}
              onDragOver={e => { e.preventDefault(); e.currentTarget.style.borderColor='var(--blue)'; }}
              onDragLeave={e => e.currentTarget.style.borderColor='var(--border)'}
              onDrop={e => { e.preventDefault(); e.currentTarget.style.borderColor='var(--border)'; iniciarProcessamento(e.dataTransfer.files); }}
              style={{ border:'2px dashed var(--border)', borderRadius:12, padding:'48px 24px', textAlign:'center', cursor:'pointer', transition:'border-color .2s' }}>
              <div style={{ fontSize:48, marginBottom:12 }}>📄</div>
              <div style={{ fontWeight:700, fontSize:15, marginBottom:6 }}>Arraste a notificação aqui</div>
              <div style={{ color:'var(--muted)', fontSize:13 }}>Pode selecionar várias notificações de uma vez</div>
            </div>
            <input ref={inputRef} type="file" accept=".pdf" multiple style={{ display:'none' }}
              onChange={e => iniciarProcessamento(e.target.files)} />
          </div>
        )}

        {estado === 'processando' && (
          <div>
            <div style={{ marginBottom:16, color:'var(--muted)', fontSize:13 }}>
              Processando {atual + 1} de {fila.length} arquivo(s)...
            </div>
            <div style={{ background:'var(--bg)', borderRadius:8, height:6, marginBottom:16, overflow:'hidden' }}>
              <div style={{ height:'100%', background:'var(--blue)', borderRadius:8, width:`${((atual)/fila.length)*100}%`, transition:'width .3s' }} />
            </div>
            {fila.map((item, i) => (
              <div key={i} style={{ display:'flex', gap:10, alignItems:'center', padding:'8px 0', borderBottom:'1px solid var(--border)', fontSize:13 }}>
                <span style={{ fontSize:16 }}>
                  {item.status==='ok'?'✅':item.status==='erro'?'❌':item.status==='processando'?'⏳':'⬜'}
                </span>
                <span style={{ flex:1, color: item.status==='erro'?'var(--red)':'var(--text)', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{item.nome}</span>
                {item.status==='ok' && <span style={{ fontSize:11, color:'var(--muted)' }}>{item.resultado?.tipo==='atualizar'?'adicionado':'novo'}</span>}
              </div>
            ))}
          </div>
        )}

        {estado === 'revisao' && form && (() => {
          const total   = extraidosRef.current.length;
          const idx     = indiceRef.current;
          const isUltimo = idx === total - 1;
          const isMulti  = total > 1;
          const decisoes = decisoesRef.current;

          return (
            <div>
              {/* Banner: processo existente ou novo */}
              <div style={{ background: form._resultado?.tipo==='atualizar' ? 'rgba(245,158,11,.08)' : 'rgba(16,185,129,.08)', border:`1px solid ${form._resultado?.tipo==='atualizar'?'rgba(245,158,11,.3)':'rgba(16,185,129,.3)'}`, borderRadius:8, padding:'10px 14px', marginBottom:16, fontSize:13, color: form._resultado?.tipo==='atualizar'?'#fcd34d':'#6ee7b7', display:'flex', justifyContent:'space-between', alignItems:'center' }}>
                <span>{form._resultado?.tipo==='atualizar' ? '⚠️ Processo já existe — a notificação será adicionada a ele.' : '✅ Novo processo. Revise e confirme.'}</span>
                {isMulti && <span style={{ color:'var(--muted)', fontSize:12 }}>{idx + 1} / {total}</span>}
              </div>

              {/* Formulário */}
              <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:12, marginBottom:16 }}>
                <div className="field" style={{ gridColumn:'1/-1' }}><label>Número</label><input value={form.numero} onChange={e=>set('numero',e.target.value)} /></div>
                <div className="field"><label>Tipo</label>
                  <select value={form.tipo} onChange={e=>set('tipo',e.target.value)}>
                    <option value="juridico">⚖️ Jurídico</option>
                    <option value="administrativo">🏛️ Administrativo</option>
                  </select>
                </div>
                <div className="field"><label>Fase</label>
                  <select value={form.fase} onChange={e=>set('fase',e.target.value)}>
                    <option>Conhecimento</option><option>Execução</option><option>Arquivado</option>
                  </select>
                </div>
                <div className="field" style={{ gridColumn:'1/-1' }}><label>Parte contrária</label><input value={form.parte} onChange={e=>set('parte',e.target.value)} /></div>
                <div className="field"><label>Tribunal</label><input value={form.tribunal} onChange={e=>set('tribunal',e.target.value)} /></div>
                <div className="field"><label>Vara / Tramitação</label><input value={form.tramitacao} onChange={e=>set('tramitacao',e.target.value)} /></div>
              </div>

              {form.audData && (
                <div style={{ background:'var(--surface2)', border:'1px solid var(--border)', borderRadius:10, padding:14, marginBottom:16 }}>
                  <div style={{ fontWeight:700, fontSize:13, marginBottom:10 }}>📅 Audiência identificada</div>
                  <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:10 }}>
                    <div className="field"><label>Data</label><input type="date" value={form.audData} onChange={e=>set('audData',e.target.value)} /></div>
                    <div className="field"><label>Hora</label><input type="time" value={form.audHora} onChange={e=>set('audHora',e.target.value)} /></div>
                    <div className="field"><label>Tipo</label><input value={form.audTipo} onChange={e=>set('audTipo',e.target.value)} /></div>
                  </div>
                  <div className="field" style={{ marginTop:8 }}><label>Local / Link</label><input value={form.audLocal} onChange={e=>set('audLocal',e.target.value)} /></div>
                </div>
              )}

              {/* Botões */}
              <div style={{ display:'flex', gap:8, justifyContent:'flex-end' }}>
                {idx > 0 && <button className="btn-secondary" onClick={voltarAnterior}>← Voltar</button>}
                <button className="btn-secondary" onClick={pularAtual}>Pular →</button>
                <button className="btn-primary" onClick={confirmarAtual} disabled={!form.numero||!form.parte}>✅ Confirmar</button>
              </div>
            </div>
          );
        })()}

        {estado === 'resumo' && (
          <div>
            <div style={{ fontWeight:700, fontSize:15, marginBottom:16 }}>Confirmar importação</div>
            {extraidosRef.current.map((item, i) => {
              const d = decisoesRef.current[i];
              const acao = d?.acao || 'pendente';
              const numero = d?.form?.numero || item.nome;
              const parte  = d?.form?.parte || '—';
              const existente = d?.form?._resultado?.tipo === 'atualizar';
              return (
                <div key={i} style={{ display:'flex', gap:12, alignItems:'center', padding:'10px 0', borderBottom:'1px solid var(--border)' }}>
                  <span style={{ fontSize:18 }}>{acao==='salvar'?'✅':acao==='pular'?'⏭️':'⬜'}</span>
                  <div style={{ flex:1, minWidth:0 }}>
                    <div style={{ fontFamily:'monospace', fontSize:12, color:'#93c5fd', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{numero}</div>
                    <div style={{ fontSize:12, color:'var(--muted)', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{parte}</div>
                  </div>
                  <span style={{ fontSize:11, color: acao==='salvar'?'var(--green)':'var(--muted)', whiteSpace:'nowrap' }}>
                    {acao==='salvar' ? (existente?'adicionar ao existente':'novo processo') : 'pular'}
                  </span>
                </div>
              );
            })}
            <div style={{ display:'flex', gap:8, justifyContent:'flex-end', marginTop:20 }}>
              <button className="btn-secondary" onClick={voltarAnterior}>← Voltar</button>
              <button className="btn-primary" onClick={finalizarTudo}>
                ✅ Confirmar e salvar {decisoesRef.current.filter(d=>d?.acao==='salvar').length} processo(s)
              </button>
            </div>
          </div>
        )}

        {estado === 'concluido' && (
          <div>
            <div style={{ textAlign:'center', padding:'16px 0 24px' }}>
              <div style={{ fontSize:40, marginBottom:8 }}>✅</div>
              <div style={{ fontWeight:700, fontSize:16 }}>
                {fila.filter(f=>f.status==='ok').length} salvo(s) · {fila.filter(f=>f.status==='pulado').length} pulado(s) · {fila.filter(f=>f.status==='erro').length} erro(s)
              </div>
            </div>
            {fila.map((item, i) => {
              const icon  = item.status==='ok' ? '✅' : item.status==='pulado' ? '⏭️' : '❌';
              const color = item.status==='ok' ? 'var(--green)' : item.status==='pulado' ? 'var(--muted)' : 'var(--red)';
              const label = item.status==='ok'
                ? (item.resultado?.tipo==='atualizar' ? 'adicionado ao processo existente' : 'novo processo criado')
                : item.status==='pulado' ? 'pulado' : item.erro || 'erro ao ler arquivo';
              return (
                <div key={i} style={{ display:'flex', gap:10, alignItems:'center', padding:'8px 0', borderBottom:'1px solid var(--border)', fontSize:13 }}>
                  <span style={{ fontSize:16 }}>{icon}</span>
                  <span style={{ flex:1, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{item.nome}</span>
                  <span style={{ fontSize:11, color }}>{label}</span>
                </div>
              );
            })}
            <div style={{ display:'flex', gap:8, justifyContent:'flex-end', marginTop:20 }}>
              <button className="btn-secondary" onClick={() => { setEstado('idle'); setFila([]); setAtual(0); setUltimoSalvo(null); }}>Importar mais</button>
              <button className="btn-primary" onClick={() => onConcluido ? onConcluido(ultimoSalvo) : onFechar()}>Fechar</button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
